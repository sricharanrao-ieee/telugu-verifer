<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dataset Verifier</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .slide-in-right { animation: slideInRight 0.3s ease-out forwards; }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #475569; }
        
        .pb-safe { padding-bottom: max(2rem, env(safe-area-inset-bottom)); }
        .pt-safe { padding-top: max(0.5rem, env(safe-area-inset-top)); }
    </style>
</head>

<script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
</script>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 overflow-hidden overscroll-none transition-colors duration-200">
    
    <div class="fixed inset-0 w-full h-full flex flex-col overflow-hidden">
        
        <!-- HEADER -->
        <header id="app-header" class="hidden bg-white dark:bg-slate-800 shadow-sm border-b border-slate-200 dark:border-slate-700 z-20 shrink-0 pt-safe transition-colors duration-200">
            <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                
                <div class="flex items-center gap-3">
                    <button id="btn-back" class="hidden w-8 h-8 flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors shrink-0">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    
                    <div class="w-8 h-8 bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 rounded-lg flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-language"></i>
                    </div>
                    <div class="flex flex-col hidden sm:flex">
                        <h1 class="font-bold text-[15px] leading-tight tracking-tight truncate">Data Verifier</h1>
                        <span id="header-user-name" class="text-[11px] font-semibold text-slate-500 uppercase tracking-wide">User</span>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <div class="flex gap-2 text-sm font-medium items-center bg-slate-100 dark:bg-slate-900/50 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                        <i class="fa-solid fa-chart-pie text-slate-400 dark:text-slate-500 mr-1"></i>
                        <span id="stats-completed" class="text-blue-600 dark:text-blue-400">0</span>
                        <span class="text-slate-400 dark:text-slate-500">/</span>
                        <span id="stats-total" class="text-slate-600 dark:text-slate-400">0</span>
                        <div class="w-px h-4 bg-slate-300 dark:bg-slate-700 mx-1"></div>
                        <button id="btn-refresh" class="text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors w-6 h-6 flex items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 active:scale-95">
                            <i class="fa-solid fa-arrows-rotate"></i>
                        </button>
                    </div>
                    
                    <button id="btn-switch-user" class="w-9 h-9 flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-900/50 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-700 transition-colors active:scale-95" title="Switch User">
                        <i class="fa-solid fa-user-gear"></i>
                    </button>
                    
                    <button id="btn-theme" class="w-9 h-9 flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-900/50 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-700 transition-colors active:scale-95">
                        <i class="fa-solid fa-moon dark:hidden"></i>
                        <i class="fa-solid fa-sun hidden dark:block"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 relative w-full h-full flex flex-col overflow-hidden max-w-4xl mx-auto">
            
            <!-- LOGIN VIEW -->
            <div id="view-login" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-900 px-6 transition-colors duration-200">
                <div class="w-full max-w-md bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-700 text-center">
                    <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl">
                        <i class="fa-solid fa-user-check"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">Welcome</h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Enter your name to track your progress separately.</p>
                    
                    <div class="mb-6 text-left">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Your Name</label>
                        <input type="text" id="input-reviewer-name" placeholder="e.g. John, Alice" class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium">
                    </div>

                    <div id="existing-users-section" class="mb-6 text-left">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Or select existing profile</label>
                        <div id="existing-users-list" class="flex flex-wrap gap-2">
                            <!-- Skeleton Loader for Profile Buttons -->
                            <div class="h-8 w-20 bg-slate-200 dark:bg-slate-700 rounded-lg animate-pulse"></div>
                            <div class="h-8 w-24 bg-slate-200 dark:bg-slate-700 rounded-lg animate-pulse"></div>
                            <div class="h-8 w-16 bg-slate-200 dark:bg-slate-700 rounded-lg animate-pulse"></div>
                        </div>
                    </div>
                    
                    <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all active:scale-95 flex justify-center items-center gap-2">
                        <span>Continue</span> <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <!-- SKELETON LOADING VIEW -->
            <div id="view-loading" class="hidden absolute inset-0 z-10 bg-slate-50 dark:bg-slate-900 flex flex-col p-4 transition-colors duration-200 pt-[70px]">
                <div class="flex gap-2 mb-4 border-b border-slate-200 dark:border-slate-800 pb-2">
                    <div class="h-8 w-24 bg-slate-200 dark:bg-slate-800 rounded-full animate-pulse"></div>
                    <div class="h-8 w-24 bg-slate-200 dark:bg-slate-800 rounded-full animate-pulse"></div>
                </div>
                <div class="flex flex-col gap-3">
                    <div class="h-24 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 animate-pulse"></div>
                    <div class="h-24 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 animate-pulse"></div>
                    <div class="h-24 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 animate-pulse"></div>
                </div>
            </div>

            <!-- DASHBOARD (LIST) VIEW -->
            <div id="view-dashboard" class="hidden absolute inset-0 z-0 flex flex-col bg-slate-50 dark:bg-slate-900 transition-colors duration-200">
                <!-- Tabs -->
                <div class="px-4 pt-4 pb-2 shrink-0 flex gap-2 overflow-x-auto custom-scroll border-b border-slate-200 dark:border-slate-800">
                    <button data-filter="all" class="filter-tab active px-4 py-2 rounded-full text-sm font-semibold transition-colors bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-900">All</button>
                    <button data-filter="pending" class="filter-tab px-4 py-2 rounded-full text-sm font-semibold transition-colors bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700">Pending</button>
                    <button data-filter="verified" class="filter-tab px-4 py-2 rounded-full text-sm font-semibold transition-colors bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700">Verified</button>
                </div>
                <!-- List Container -->
                <div id="list-container" class="flex-1 overflow-y-auto custom-scroll p-4 flex flex-col gap-3 pb-24">
                    <!-- Dynamically populated -->
                </div>
            </div>

            <!-- DETAIL (REVIEW) VIEW -->
            <div id="view-detail" class="hidden absolute inset-0 z-0 flex flex-col bg-slate-50 dark:bg-slate-900 transition-colors duration-200">
                
                <div class="flex-1 overflow-y-auto custom-scroll p-4 pb-12">
                    <div class="flex justify-between items-center mb-4">
                        <div id="detail-id" class="bg-slate-800 dark:bg-slate-700 text-white font-bold px-3 py-1.5 rounded-lg text-sm shadow-sm"></div>
                        <div id="detail-row" class="text-xs font-semibold text-slate-500 dark:text-slate-400 bg-slate-200 dark:bg-slate-800 px-2 py-1 rounded"></div>
                    </div>

                    <div id="levels-container" class="flex flex-col gap-3">
                        <!-- Populated dynamically -->
                    </div>

                    <div class="mt-6 mb-16">
                        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2"><i class="fa-solid fa-comment mr-1"></i> Comments (Optional)</label>
                        <textarea id="input-comment" rows="2" placeholder="Add any notes..." class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none transition-colors duration-200"></textarea>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 px-4 pt-4 shrink-0 flex items-center justify-between gap-3 shadow-[0_-10px_15px_-3px_rgb(0,0,0,0.05)] dark:shadow-[0_-10px_15px_-3px_rgb(0,0,0,0.2)] z-20 pb-safe transition-colors duration-200">
                    <button id="btn-prev" class="w-12 h-12 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 transition-colors shrink-0 active:scale-95 disabled:opacity-30 disabled:pointer-events-none">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    
                    <div class="flex-1 flex gap-3 max-w-sm mx-auto">
                        <button id="btn-no" class="flex-1 bg-white dark:bg-slate-800 border-2 border-rose-200 dark:border-rose-900/50 hover:bg-rose-50 dark:hover:bg-rose-900/30 text-rose-600 dark:text-rose-400 font-bold py-2.5 rounded-xl transition-all flex flex-col items-center justify-center gap-1 active:scale-95 group relative">
                            <i class="fa-solid fa-xmark text-xl group-hover:scale-110 transition-transform"></i> 
                            <span class="text-xs uppercase tracking-wide">Incorrect</span>
                        </button>
                        <button id="btn-yes" class="flex-1 bg-white dark:bg-slate-800 border-2 border-emerald-200 dark:border-emerald-900/50 hover:bg-emerald-50 dark:hover:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 font-bold py-2.5 rounded-xl transition-all flex flex-col items-center justify-center gap-1 active:scale-95 group relative">
                            <i class="fa-solid fa-check text-xl group-hover:scale-110 transition-transform"></i> 
                            <span class="text-xs uppercase tracking-wide">Correct</span>
                        </button>
                    </div>

                    <button id="btn-next" class="w-12 h-12 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 transition-colors shrink-0 active:scale-95 disabled:opacity-30 disabled:pointer-events-none">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="fixed top-4 right-4 max-w-[90vw] bg-slate-800 dark:bg-slate-700 text-white px-4 py-3 rounded-lg shadow-xl transform transition-all duration-300 translate-y-[-150%] opacity-0 z-50 flex items-center gap-3">
        <i id="toast-icon" class="fa-solid fa-circle-info"></i>
        <span id="toast-message" class="text-sm font-medium">Message</span>
    </div>

    <script>
        let allData = [];
        let currentFilter = 'all'; 
        let currentViewIndices = []; 
        let activeDataIndex = -1;    
        let isSubmitting = false;
        let isDataLoaded = false;
        
        let currentReviewer = localStorage.getItem('reviewerName') || '';
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbzUsZA0Q1ILEAago1xMRsqcQEzY8YYIX0o16G7dNWIo9Ef20hWAwBvGBbOVtNikTSK5/exec';

        document.addEventListener('DOMContentLoaded', () => {
            setupThemeToggle();
            setupTabListeners();
            setupHistoryAPI();
            
            // Instantly load cached profiles so the UI feels fast
            loadCachedProfiles();
            
            const cachedData = localStorage.getItem('cachedSheetData');
            if (cachedData) {
                try {
                    allData = JSON.parse(cachedData);
                    isDataLoaded = true;
                } catch(e) {
                    console.error("Cache parsing error", e);
                }
            }

            // Start loading fresh data in the background instantly
            fetchDataFromSheetInBackground();

            if (currentReviewer) {
                // User already logged in previously
                setupReviewerKeys(currentReviewer);
                document.getElementById('view-login').classList.add('hidden');
                
                if (isDataLoaded) {
                    document.getElementById('app-header').classList.remove('hidden');
                    proceedToDashboard();
                } else {
                    document.getElementById('app-header').classList.remove('hidden');
                    document.getElementById('view-loading').classList.remove('hidden');
                }
            }
            
            // Login Handlers
            document.getElementById('btn-login').addEventListener('click', (e) => handleLogin(e));
            document.getElementById('input-reviewer-name').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });
            
            document.getElementById('btn-switch-user').addEventListener('click', () => {
                localStorage.removeItem('reviewerName');
                currentReviewer = '';
                location.reload(); // Quickest way to reset state safely
            });
        });

        function setupReviewerKeys(name) {
            const safeName = name.replace(/[^a-zA-Z0-9]/g, '_');
            verifyColKey = safeName + '_Verified';
            commentColKey = safeName + '_Comments';
            
            document.getElementById('header-user-name').innerText = name;
            
            // Re-apply filter based on this specific user's column
            if (isDataLoaded) applyFilter(currentFilter);
        }

        function handleLogin() {
            const name = document.getElementById('input-reviewer-name').value.trim();
            if(!name) {
                showToast("Please enter a name", "error");
                return;
            }
            
            currentReviewer = name;
            localStorage.setItem('reviewerName', currentReviewer);
            setupReviewerKeys(currentReviewer);
            
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('app-header').classList.remove('hidden');
            
            if (isDataLoaded) {
                proceedToDashboard();
            } else {
                document.getElementById('view-loading').classList.remove('hidden');
            }
        }

        function loginAsExistingUser(name) {
            document.getElementById('input-reviewer-name').value = name;
            handleLogin();
        }

        async function fetchDataFromSheetInBackground() {
            try {
                const urlWithCacheBuster = scriptUrl + "?t=" + new Date().getTime();
                const response = await fetch(urlWithCacheBuster, {
                    method: 'GET',
                    redirect: 'follow', 
                    cache: 'no-store'   
                });
                
                if (!response.ok) throw new Error("Failed to connect");
                
                const freshData = await response.json();
                allData = freshData;
                isDataLoaded = true;
                
                // Cache the full data for instant loading next time
                localStorage.setItem('cachedSheetData', JSON.stringify(allData));
                
                extractExistingReviewers();
                
                // If the user is on the dashboard, quietly refresh the list with new data
                if (currentReviewer && history.state?.view !== 'detail' && !document.getElementById('view-dashboard').classList.contains('hidden')) {
                    applyFilter(currentFilter);
                } else if (currentReviewer && !document.getElementById('app-header').classList.contains('hidden') && document.getElementById('view-dashboard').classList.contains('hidden') && history.state?.view !== 'detail') {
                    // Transition from loading skeleton to dashboard if they were waiting
                    proceedToDashboard();
                }
            } catch (error) {
                console.error(error);
                if (!isDataLoaded) {
                    // Only show error if we also have NO cached data
                    showToast("Failed to connect to Google Sheets.", 'error');
                    
                    if (!localStorage.getItem('cachedProfiles')) {
                        const list = document.getElementById('existing-users-list');
                        if (list) list.innerHTML = '<span class="text-sm text-rose-500 dark:text-rose-400 italic">Failed to load profiles. Please manually type your name.</span>';
                    }
                } else {
                    console.log("Offline mode active. Using cached data.");
                }
            }
        }

        function loadCachedProfiles() {
            const cached = localStorage.getItem('cachedProfiles');
            if (cached) {
                renderUserButtons(JSON.parse(cached));
            }
        }

        function extractExistingReviewers() {
            if (allData.length === 0) {
                renderUserButtons([]);
                return;
            }
            
            const keys = Object.keys(allData[0]);
            const existingUsers = [];
            
            keys.forEach(key => {
                if (key.endsWith('_Verified')) {
                    const name = key.replace('_Verified', '');
                    if(name !== 'Verified_Is_Correct') { // Ignore the old legacy column
                        existingUsers.push(name.replace(/_/g, ' '));
                    }
                }
            });

            // Cache the users so next time the app opens, they appear instantly
            if (existingUsers.length > 0) {
                localStorage.setItem('cachedProfiles', JSON.stringify(existingUsers));
            }
            
            renderUserButtons(existingUsers);
        }

        function renderUserButtons(users) {
            const list = document.getElementById('existing-users-list');
            if (!list) return;
            
            list.innerHTML = '';

            if (users.length > 0) {
                users.forEach(user => {
                    const btn = document.createElement('button');
                    btn.className = "bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 border border-slate-200 dark:border-slate-600 flex items-center gap-2 active:scale-95 shadow-sm";
                    btn.innerHTML = `<span>${user}</span>`;
                    btn.onclick = (e) => loginAsExistingUser(user, e.currentTarget);
                    list.appendChild(btn);
                });
            } else {
                list.innerHTML = '<span class="text-sm text-slate-400 italic">No existing profiles found.</span>';
            }
        }

        function loginAsExistingUser(name, btnElement) {
            document.getElementById('input-reviewer-name').value = name;
            
            if (btnElement) {
                const originalContent = btnElement.innerHTML;
                btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Loading...`;
                btnElement.classList.add('opacity-70', 'pointer-events-none');
                
                setTimeout(() => {
                    handleLogin();
                    // Reset button state just in case user logs out and returns
                    setTimeout(() => {
                        btnElement.innerHTML = originalContent;
                        btnElement.classList.remove('opacity-70', 'pointer-events-none');
                    }, 500);
                }, 400); // Added a UX delay so the user sees the loading state
            } else {
                handleLogin();
            }
        }

        function handleLogin(e) {
            const name = document.getElementById('input-reviewer-name').value.trim();
            if(!name) {
                showToast("Please enter a name", "error");
                return;
            }
            
            // Handle loading state for main "Continue" button
            const mainBtn = document.getElementById('btn-login');
            let isMainClick = false;
            let originalBtnHtml = "";
            
            if (e && e.currentTarget === mainBtn) {
                isMainClick = true;
                originalBtnHtml = mainBtn.innerHTML;
                mainBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Setting up...</span>`;
                mainBtn.classList.add('opacity-80', 'pointer-events-none');
            }
            
            setTimeout(() => {
                currentReviewer = name;
                localStorage.setItem('reviewerName', currentReviewer);
                setupReviewerKeys(currentReviewer);
                
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('app-header').classList.remove('hidden');
                
                if (isDataLoaded) {
                    proceedToDashboard();
                } else {
                    document.getElementById('view-loading').classList.remove('hidden');
                }

                if (isMainClick) {
                    setTimeout(() => {
                        mainBtn.innerHTML = originalBtnHtml;
                        mainBtn.classList.remove('opacity-80', 'pointer-events-none');
                    }, 500);
                }
            }, 400); // Add a 400ms delay to make it feel like proper authentication
        }

        function proceedToDashboard() {
            document.getElementById('view-loading').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            applyFilter(currentFilter);
        }

        // ==========================================
        // THEME & BROWSER HISTORY LOGIC
        // ==========================================
        function setupThemeToggle() {
            const btnTheme = document.getElementById('btn-theme');
            btnTheme.addEventListener('click', () => {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    localStorage.theme = 'light';
                } else {
                    html.classList.add('dark');
                    localStorage.theme = 'dark';
                }
            });
        }

        function setupHistoryAPI() {
            history.replaceState({ view: 'dashboard' }, '', window.location.pathname);
            window.addEventListener('popstate', (event) => {
                if (!event.state || event.state.view === 'dashboard') {
                    applyFilter(currentFilter);
                    document.getElementById('view-detail').classList.add('hidden');
                    document.getElementById('view-dashboard').classList.remove('hidden');
                    document.getElementById('btn-back').classList.add('hidden');
                }
            });
            document.getElementById('btn-back').addEventListener('click', () => history.back());
        }

        // ==========================================
        // DASHBOARD & LISTING
        // ==========================================
        function setupTabListeners() {
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-tab').forEach(t => {
                        t.className = "filter-tab px-4 py-2 rounded-full text-sm font-semibold transition-colors bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700";
                    });
                    const target = e.target;
                    target.className = "filter-tab active px-4 py-2 rounded-full text-sm font-semibold transition-colors bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-900";
                    applyFilter(target.dataset.filter);
                });
            });
        }

        function applyFilter(filter) {
            currentFilter = filter;
            currentViewIndices = [];
            const container = document.getElementById('list-container');
            container.innerHTML = '';

            if (allData.length === 0) {
                container.innerHTML = `<div class="text-center p-8 text-slate-500">No data found in sheet.</div>`;
                return;
            }

            let hasItems = false;

            allData.forEach((row, index) => {
                // Use the specific user's verification column
                const userAnswer = row[verifyColKey];
                const isVerified = !!userAnswer;
                
                if (filter === 'pending' && isVerified) return;
                if (filter === 'verified' && !isVerified) return;
                
                currentViewIndices.push(index);
                hasItems = true;

                const el = document.createElement('div');
                el.className = "bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-start gap-3 cursor-pointer hover:border-blue-400 dark:hover:border-blue-500 transition-all active:scale-[0.99]";
                
                let iconHtml = '<i class="fa-regular fa-circle text-slate-300 dark:text-slate-600 text-xl"></i>';
                if (userAnswer === 'Yes') iconHtml = '<i class="fa-solid fa-circle-check text-emerald-500 text-xl"></i>';
                if (userAnswer === 'No') iconHtml = '<i class="fa-solid fa-circle-xmark text-rose-500 text-xl"></i>';

                const idLabel = escapeHTML(row.ID || `Row ${row._rowIndex}`);
                const previewTitle = escapeHTML(row.Original_English || 'No original text available');
                const previewSubtitle = escapeHTML(row.Level_100_Telugu || 'No translation available');
                
                const hasComment = !!row[commentColKey];
                
                el.innerHTML = `
                    <div class="mt-0.5 shrink-0 flex items-center justify-center w-6 h-6">${iconHtml}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[11px] font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded tracking-wide">${idLabel}</span>
                            ${hasComment ? '<i class="fa-solid fa-comment text-blue-400 text-xs"></i>' : ''}
                        </div>
                        <p class="text-sm font-bold text-slate-800 dark:text-slate-200 truncate">${previewTitle}</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400 truncate mt-1">${previewSubtitle}</p>
                    </div>
                `;
                
                el.onclick = () => openDetail(index);
                container.appendChild(el);
            });

            if (!hasItems) {
                container.innerHTML = `<div class="text-center flex flex-col items-center justify-center py-12 text-slate-500">
                    <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mb-3">
                        <i class="fa-solid fa-folder-open text-2xl text-slate-300 dark:text-slate-600"></i>
                    </div>
                    <p>No ${filter === 'all' ? '' : filter} items found.</p>
                </div>`;
            }

            updateStats();
        }

        function updateStats() {
            const total = allData.length;
            const completed = allData.filter(r => !!r[verifyColKey]).length;
            document.getElementById('stats-completed').innerText = completed;
            document.getElementById('stats-total').innerText = total;
        }

        // ==========================================
        // DETAIL VIEW
        // ==========================================
        function openDetail(dataIndex) {
            activeDataIndex = dataIndex;
            const row = allData[dataIndex];
            
            if (history.state?.view !== 'detail') {
                history.pushState({ view: 'detail', id: dataIndex }, '', '#review');
            }

            document.getElementById('detail-id').innerText = row.ID || `ID Not Set`;
            document.getElementById('detail-row').innerText = `Sheet Row: ${row._rowIndex}`;
            
            const levelsContainer = document.getElementById('levels-container');
            levelsContainer.innerHTML = '';
            
            const fieldConfig = [
                { key: 'Original_English', label: 'Original English', style: 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800' },
                { key: 'Level_0_English', label: 'Level 0 (English)', style: 'border-blue-400 bg-blue-50/40 dark:bg-blue-900/10' },
                { key: 'Level_25_CodeMix', label: 'Level 25 (CodeMix)', style: 'border-indigo-400 bg-indigo-50/40 dark:bg-indigo-900/10' },
                { key: 'Level_50_CodeMix', label: 'Level 50 (CodeMix)', style: 'border-violet-400 bg-violet-50/40 dark:bg-violet-900/10' },
                { key: 'Level_75_CodeMix', label: 'Level 75 (CodeMix)', style: 'border-purple-400 bg-purple-50/40 dark:bg-purple-900/10' },
                { key: 'Level_100_Telugu', label: 'Level 100 (Telugu)', style: 'border-fuchsia-400 bg-fuchsia-50/40 dark:bg-fuchsia-900/10' }
            ];

            fieldConfig.forEach(item => {
                if(row[item.key] !== undefined && row[item.key] !== "") {
                    levelsContainer.innerHTML += `
                        <div class="border-l-4 ${item.style} rounded-r-xl p-3 shadow-sm border border-slate-200 dark:border-slate-700/50 border-l-[4px]">
                            <div class="flex justify-between items-start mb-1">
                                <div class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mt-1">${item.label}</div>
                            </div>
                            <div class="text-sm sm:text-base text-slate-800 dark:text-slate-200 font-medium whitespace-pre-wrap pr-2">${escapeHTML(String(row[item.key]))}</div>
                        </div>
                    `;
                }
            });

            // Load specific user's comment
            document.getElementById('input-comment').value = row[commentColKey] || '';

            const btnYes = document.getElementById('btn-yes');
            const btnNo = document.getElementById('btn-no');
            
            btnYes.className = btnYes.className.replace(/ring-4 ring-emerald-500\/30 bg-emerald-50 dark:bg-emerald-900\/30/g, 'bg-white dark:bg-slate-800');
            btnNo.className = btnNo.className.replace(/ring-4 ring-rose-500\/30 bg-rose-50 dark:bg-rose-900\/30/g, 'bg-white dark:bg-slate-800');
            
            // Check specific user's verification status
            if(row[verifyColKey] === 'Yes') {
                btnYes.className = btnYes.className.replace('bg-white dark:bg-slate-800', 'bg-emerald-50 dark:bg-emerald-900/30 ring-4 ring-emerald-500/30');
            } else if (row[verifyColKey] === 'No') {
                btnNo.className = btnNo.className.replace('bg-white dark:bg-slate-800', 'bg-rose-50 dark:bg-rose-900/30 ring-4 ring-rose-500/30');
            }

            const currentIndexInView = currentViewIndices.indexOf(activeDataIndex);
            document.getElementById('btn-prev').disabled = currentIndexInView <= 0;
            document.getElementById('btn-next').disabled = currentIndexInView >= currentViewIndices.length - 1;

            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-detail').classList.remove('hidden');
            document.getElementById('btn-back').classList.remove('hidden');
            
            document.querySelector('#view-detail > div').scrollTop = 0;
        }

        // ==========================================
        // SAVING DATA
        // ==========================================
        function handleVote(isCorrect) {
            // Prevent double-clicking while it is already processing
            if (activeDataIndex === -1 || isSubmitting) return;
            
            const row = allData[activeDataIndex];
            const answerText = isCorrect ? 'Yes' : 'No';
            const commentText = document.getElementById('input-comment').value.trim();

            // If nothing changed, just move to the next
            if (row[verifyColKey] === answerText && (row[commentColKey] || '') === commentText) {
                goToNextOrDashboard();
                return;
            }

            // --- UI FEEDBACK (Micro-interaction) ---
            isSubmitting = true;
            const targetBtn = isCorrect ? document.getElementById('btn-yes') : document.getElementById('btn-no');
            const originalHtml = targetBtn.innerHTML;

            // Change button to show a satisfying "Saving..." spinner
            targetBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xl"></i> <span class="text-xs uppercase tracking-wide">Saving...</span>`;
            
            // 1. BACKGROUND SYNC: Send to Google Sheets instantly so we don't lose time
            fetch(scriptUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    rowIndex: row._rowIndex,
                    isCorrect: answerText,
                    comment: commentText,
                    reviewerName: currentReviewer // Pass name to backend
                })
            }).catch(error => {
                console.error("Save failed:", error);
                showToast(`Failed to sync row ${row._rowIndex} to cloud. Check internet.`, "error");
            });

            // 2. DELAYED TRANSITION: Wait a bit longer to show deliberate effort
            setTimeout(() => {
                // Change to a brief "Saved!" checkmark state
                targetBtn.innerHTML = `<i class="fa-solid fa-check text-xl"></i> <span class="text-xs uppercase tracking-wide">Saved!</span>`;
                
                setTimeout(() => {
                    // Restore the button back to normal
                    targetBtn.innerHTML = originalHtml;
                    isSubmitting = false;

                    // OPTIMISTIC UPDATE: Update data in the browser memory
                    row[verifyColKey] = answerText;
                    row[commentColKey] = commentText;
                    
                    // Calculate what the next row should be BEFORE we update the list
                    const currentIndexInView = currentViewIndices.indexOf(activeDataIndex);
                    let nextDataIndexToLoad = -1;
                    if (currentIndexInView >= 0 && currentIndexInView < currentViewIndices.length - 1) {
                        nextDataIndexToLoad = currentViewIndices[currentIndexInView + 1];
                    }

                    // FAST UI NAVIGATION: Move immediately to the next screen
                    if (nextDataIndexToLoad !== -1) {
                        applyFilter(currentFilter); 
                        openDetail(nextDataIndexToLoad); 
                    } else {
                        applyFilter(currentFilter);
                        showToast("Reached the end of the list!", "success");
                        history.back(); 
                    }
                }, 300); // Wait 300ms showing "Saved!" before moving to the next card
            }, 600); // Wait 600ms showing "Saving..." to simulate connection effort
        }

        function goToNextOrDashboard() {
            const currentIndexInView = currentViewIndices.indexOf(activeDataIndex);
            if (currentIndexInView >= 0 && currentIndexInView < currentViewIndices.length - 1) {
                openDetail(currentViewIndices[currentIndexInView + 1]);
            } else {
                history.back(); 
            }
        }

        // ==========================================
        // LISTENERS & UTILS
        // ==========================================
        document.getElementById('btn-yes').addEventListener('click', () => handleVote(true));
        document.getElementById('btn-no').addEventListener('click', () => handleVote(false));
        
        document.getElementById('btn-back').addEventListener('click', () => {
            history.back();
        });
        
        document.getElementById('btn-next').addEventListener('click', () => {
            const currentIndexInView = currentViewIndices.indexOf(activeDataIndex);
            if (currentIndexInView < currentViewIndices.length - 1) openDetail(currentViewIndices[currentIndexInView + 1]);
        });
        
        document.getElementById('btn-prev').addEventListener('click', () => {
            const currentIndexInView = currentViewIndices.indexOf(activeDataIndex);
            if (currentIndexInView > 0) openDetail(currentViewIndices[currentIndexInView - 1]);
        });

        document.getElementById('btn-refresh').addEventListener('click', () => {
            const icon = document.querySelector('#btn-refresh i');
            icon.classList.add('fa-spin'); 
            document.getElementById('view-loading').classList.remove('hidden');
            document.getElementById('view-dashboard').classList.add('hidden');
            
            fetchDataFromSheetInBackground().finally(() => {
                icon.classList.remove('fa-spin');
                showToast("Data synced!", "success");
            });
        });

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function showToast(message, type = 'info') {
            const toastEl = document.getElementById('toast');
            const toastIcon = document.getElementById('toast-icon');
            document.getElementById('toast-message').innerText = message;
            
            if (type === 'success') toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            else if (type === 'error') toastIcon.className = 'fa-solid fa-circle-xmark text-rose-400';
            else toastIcon.className = 'fa-solid fa-circle-info text-blue-400';

            toastEl.style.transform = 'translateY(0)';
            toastEl.style.opacity = '1';

            setTimeout(() => {
                toastEl.style.transform = 'translateY(-150%)';
                toastEl.style.opacity = '0';
            }, 3000);
        }
    </script>
</body>
</html>
